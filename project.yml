name: KingVid
options:
  bundleIdPrefix: com.matostudios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  KingVid:
    type: application
    platform: iOS
    sources:
      - path: KingVid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matostudios.kingvid
        PRODUCT_NAME: KingVid
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: KingVid/Info.plist
      properties:
        CFBundleDisplayName: KingVid
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchCrown
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Websites you visit in KingVid can ask to use the camera.
        NSMicrophoneUsageDescription: Websites you visit in KingVid can ask to use the microphone.
        NSLocationWhenInUseUsageDescription: Websites you visit in KingVid can ask for your location.
        NSPhotoLibraryAddUsageDescription: KingVid can save images you choose from websites.
schemes:
  KingVid:
    build:
      targets:
        KingVid: all
    run:
      config: Debug
    archive:
      config: Release
